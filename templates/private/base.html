{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Connect Responsibility</title>

    <link rel="shortcut icon" href="{% static 'assets/img/co-roxo.png' %}">
    <link rel="stylesheet" href="{% static 'assets/css/private/base.css' %}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    {% block style %}{% endblock %}

</head>
<body>
    <aside id="sidebar">
        <div class="logo-section">
            <a href="/">
                <img src="{% static 'assets/img/co.png' %}" alt="Logo" width="80" draggable="false">
            </a>
        </div>
        <nav>
            <ul>
                <li><a href="#"><i class="fas fa-chart-line"></i>Início</a></li>
                <li><a href="#"><i class="fas fa-bullhorn"></i>Campanhas</a></li>
                <li><a href="#"><i class="fas fa-users"></i>Doadores</a></li>
                <li><a href="#"><i class="fas fa-donate"></i>Relatórios</a></li>
                <li><a href="#"><i class="fas fa-cogs"></i>Configurações</a></li>
            </ul>
        </nav>
    </aside>
    <div id="main-content">
        <header id="main-header">
            <h1>Dashboard</h1>
            <div class="header-actions">
                <button id="addCampaign">Nova Campanha</button>
                <button style="background:none; color: #333">Perfil</button>
            </div>
        </header>
        {% block content %}
        {% endblock %}

        {% include 'footer.html' %}
    </div>
</body>
</html>
