[project]
name = "connect-responsibily"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0",
    "django-environ",
    "gunicorn",
    # ...
]

[tool.black]
line-length = 88
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"*/settings.py" = ["E501"]